<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reverse : Noir Chronicle | Community</title>
  <link rel="stylesheet" href="/community/connect.css?v=brand-20261022">
  <script src="/community/connect.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/community" aria-label="RNC - Reverse : Noir Chronicle"><img class="community-wordmark" src="/assets/Title_Demo.png" alt="Reverse : Noir Chronicle" width="1818" height="156"></a>
    <nav aria-label="Main navigation">

      <span aria-current="page">Community</span>
    </nav>
  </header>
  <main>
    <section class="connect-panel" aria-labelledby="connect-title">
      <div class="panel-glow" aria-hidden="true"></div>
      <div class="panel-content">
        <div class="connection-copy">
          <p class="eyebrow">RNC / COMMUNITY ACCESS</p>
          <h1 id="connect-title">เชื่อมต่อ Discord<br>ของคุณ</h1>
          <p class="intro">ยืนยันบัญชีของคุณเพื่อเข้าเป็นส่วนหนึ่งของ community</p>
          <p class="status" id="connectionStatus" role="status" hidden></p>
          <a class="connect-button" id="connectButton" href="/auth/discord/start">Continue with Discord</a>
          <p class="privacy-note">ใช้ข้อมูลบัญชีพื้นฐานและสถานะสมาชิกเพื่อยืนยันสิทธิ์เท่านั้น</p>
        </div>
        <section class="discord-preview" aria-label="โปรไฟล์เซิร์ฟเวอร์ Discord">
          <div class="server-preview-banner" id="serverPreviewBanner">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.7 5.2a18.2 18.2 0 0 0-4.5-1.4l-.6 1.2a16.8 16.8 0 0 0-5.2 0l-.6-1.2a18.2 18.2 0 0 0-4.5 1.4C1.5 9.4.7 13.5 1.1 17.5a18.3 18.3 0 0 0 5.6 2.8l1.2-2a11.8 11.8 0 0 1-1.9-.9l.5-.4a13 13 0 0 0 11 0l.5.4a11.8 11.8 0 0 1-1.9.9l1.2 2a18.3 18.3 0 0 0 5.6-2.8c.5-4.7-.8-8.8-3.2-12.3ZM8.7 14.8c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Zm6.6 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z"/></svg>
          </div>
          <div class="server-preview-body" id="serverPreviewBody">
            <div class="server-avatar-wrap">
              <span class="server-breathing-glow" aria-hidden="true"></span>
              <div class="server-avatar">
                <span id="serverAvatarFallback" aria-hidden="true">RNC</span>
                <img id="serverAvatar" alt="" hidden>
              </div>
            </div>
            <div class="server-preview-copy">
              <img class="server-preview-wordmark" src="/assets/Title_White.png" width="1818" height="156" alt="">
              <h2 id="serverName">Reverse : Noir Chronicle</h2>
            </div>
          </div>
          <div class="server-preview-footer" id="serverPreviewFooter"><span aria-hidden="true"></span><strong id="serverOnlineCount">กำลังโหลดจำนวนออนไลน์…</strong></div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
